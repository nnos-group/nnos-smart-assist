<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart-Sell | Plataforma Inteligente de Vendas de F&amp;I • Stellantis</title>
    <meta name="description" content="Plataforma Inteligente de Vendas de F&amp;I • Stellantis" />
    <meta name="author" content="Smart-Sell" />

    <!-- Google Fonts: Inter, Plus Jakarta Sans, JetBrains Mono & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Open Graph / Redes Sociais & Compartilhamento de Link -->
    <meta property="og:title" content="Smart-Sell | Plataforma Inteligente de Vendas de F&amp;I • Stellantis" />
    <meta property="og:description" content="Plataforma Inteligente de Vendas de F&amp;I • Stellantis" />
    <meta property="og:type" content="website" />

    <!-- Meta tags mobile & branding -->
    <meta name="theme-color" content="#0a1e3f" />
  </head>

  <body>
    <!-- SPA route restore for GitHub Pages deep linking -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
